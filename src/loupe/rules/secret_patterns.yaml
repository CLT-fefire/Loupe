# secret_scan 패턴. regex 는 바이트 정규식(UTF-8)이다. group 이 있으면 그 그룹을 값으로 본다.
# confidence: high(형식만으로 거의 확실) / medium / low(문맥으로 추정, 오탐 많음)
# allow: 값이 이 정규식에 맞으면 버린다(문서 예시 값 등).
# public: 앱에 들어가는 것이 전제인 클라이언트 키. 노출 자체보다 사용 제한 설정을 확인한다.
patterns:
  - id: aws_access_key
    name: AWS 액세스 키 ID
    regex: '(?<![A-Z0-9])(?:AKIA|ASIA)[0-9A-Z]{16}(?![A-Z0-9])'
    confidence: high
    allow: 'EXAMPLE$'
  - id: google_api_key
    name: Google API 키
    regex: 'AIza[0-9A-Za-z_\-]{35}'
    confidence: high
    public: true
    note: Firebase·Maps 같은 클라이언트 키는 앱에 들어가는 것이 전제다. 콘솔에서 앱(번들 id)·API 제한이 걸려 있는지 확인한다.
  - id: private_key
    name: PEM 개인 키
    # 실제 개행뿐 아니라 JSON·plist 문자열 안의 이스케이프(\n)도 받는다(서비스 계정 JSON 의 private_key)
    regex: '-----BEGIN (?:[A-Z]+ )?PRIVATE KEY-----(?:[\r\n]|\\[rn])+(?:[A-Za-z0-9+/=\r\n]|\\[rn]){64,}'
    confidence: high
  - id: jwt
    name: JWT
    regex: 'eyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{16,}'
    confidence: medium
  - id: slack_token
    name: Slack 토큰
    regex: 'xox[abposr]-[0-9A-Za-z-]{10,}'
    confidence: high
  - id: github_token
    name: GitHub 토큰
    regex: 'gh[pousr]_[A-Za-z0-9]{36}'
    confidence: high
  - id: stripe_secret
    name: Stripe 비밀 키
    regex: '(?:sk|rk)_live_[0-9A-Za-z]{20,}'
    confidence: high
  - id: fcm_server_key
    name: FCM 서버 키(레거시)
    regex: 'AAAA[A-Za-z0-9_-]{7}:APA91b[A-Za-z0-9_-]{100,}'
    confidence: high
  - id: url_credentials
    name: URL 에 든 계정·비밀번호
    # NUL·제어·비ASCII 바이트를 넘지 않는다(Mach-O 문자열 표에서 서로 다른 문자열을 이어 붙이지 않게)
    regex: '[a-z][a-z0-9+.-]{1,9}://[^\x00-\x20\x7f-\xff/:@"''<>%]{1,64}:[^\x00-\x20\x7f-\xff/:@"''<>%]{1,128}@[A-Za-z0-9.-]+'
    confidence: medium
  - id: assigned_secret
    name: 이름이 비밀값인 대입(설정 파일·스크립트)
    regex: '(?i)(?:api[_-]?key|secret[_-]?key|client[_-]?secret|access[_-]?token|auth[_-]?token|password)["'']?\s*[:=]\s*["'']([A-Za-z0-9+/=_\-]{16,})["'']'
    confidence: low
  - id: plist_secret
    name: plist 에서 이름이 비밀값인 항목
    # 바이너리 plist 는 secret_scan 이 XML 로 바꿔서 본다. 값은 키·토큰 모양 문자만 받는다
    # (Localizable.strings 의 'password_hint' 같은 화면 문구 102건이 오탐으로 걸렸다, 2026-11-10)
    regex: '(?i)<key>[^<]*(?:api[_-]?key|secret|access[_-]?token|auth[_-]?token|password|private[_-]?key)[^<]*</key>\s*<string>([A-Za-z0-9+/=_.:\-]{16,})</string>'
    confidence: low
